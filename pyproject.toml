[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiprimer-pipeline"
version = "0.1.0"
description = "AI Primer 2.0: chat-driven ingestion of resources into Google Drive and per-author knowledge summaries"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "rapidfuzz>=3.6",
    "python-slugify>=8.0",
    "charset-normalizer>=3.3",
    "tenacity>=8.2",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "pysocks>=1.7",
    "apify-client>=1.6",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["prompts/*.md", "templates/*.j2", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
