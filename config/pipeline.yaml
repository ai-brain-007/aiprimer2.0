# AI Primer pipeline configuration. Safe to commit: contains no secrets.

apify:
  metadata_actor: "apidojo/youtube-scraper"
  transcript_actor: "supreme_coder/youtube-transcript-scraper"
  # Videos per transcript run (one Apify run per batch keeps runs resumable and cheap to retry).
  transcript_batch_size: 25
  # 0 = list every video of a channel.
  channel_max_results: 0
  # Rough prices used for the cost estimate shown before a channel is ingested.
  est_usd_per_video_metadata: 0.0005
  est_usd_per_transcript: 0.0007
  # Above this estimated amount the agent must get an explicit confirmation of the amount.
  cost_confirm_usd: 5.0
  # Field names of the two actors. `setup fetch-apify-schemas` verifies them against the live
  # input schema and rewrites this block if the actor changed its input format.
  input_templates:
    metadata:
      start_urls_key: startUrls
      max_results_key: maxItems
      extra: {}
      start_urls_format: strings
    transcript:
      start_urls_key: urls
      extra: {}
      start_urls_format: strings

drive:
  raw_root_name: "AI Primer Raw"
  inbox_name: "_Inbox"
  summaries_root_name: "AI Primer Summaries"
  upload_chunk_mb: 8
  # Files smaller than this are read fully to compute the fingerprint before upload (always true today).
  max_title_chars: 80

extract:
  # A PDF is treated as scanned when the median characters per page over the sample is below this.
  scanned_median_chars_threshold: 200
  scanned_sample_pages: 10
  ocr_dpi: 300
  # Pages whose mean OCR confidence is below this are handed to the agent to transcribe by eye.
  ocr_low_confidence: 60
  vision_render_dpi: 150
  # A [mm:ss] marker is inserted in transcripts about every N seconds.
  transcript_marker_seconds: 60
  tabular_sample_rows: 20
  # Video files dropped into the chat: store the audio track + key frames (audio_frames) or the full file (full).
  # `ingest run --keep-full` overrides per file. Keeps a free 10 GB Backblaze account useful for ~150 hours.
  video_store: audio_frames
  video_audio_kbps: 48
  video_key_frames: 6

kb:
  # Chunk size for helper agents (approximate tokens, computed as characters / 4).
  chunk_tokens: 12000
  chunk_overlap_tokens: 300
  pages_per_window_without_toc: 30
  # A citation quote must match the source text at least this well (0-100) to be accepted.
  quote_match_threshold: 90
  candidate_limit: 5
  # Name similarity at or above this, with similar details, is auto-classified SAME.
  auto_same_threshold: 95
  # Below this name similarity, with no description overlap, a unit is auto-classified NEW.
  llm_review_threshold: 70
  description_partial_threshold: 80
  # Units whose newest citation is older than this many years appear in the obsolescence watch.
  obsolescence_years: 7
  # Split the rendered summary into one Doc per Domain above this size.
  max_doc_chars: 900000
  parallel_helpers: 4

docs:
  # anyone_with_link (viewer) or restricted (owner only until shared by hand)
  sharing: anyone_with_link
  title_prefix: "Summary — "

# v2 storage: Backblaze B2. One account row per B2 application key found in the environment
# (B2_KEY_ID_0001 + B2_APPLICATION_KEY_0001 -> account b2-0001). Bucket names are global across Backblaze,
# so the default carries the account number; override per account with B2_BUCKET_0001. A public media bucket
# is optional (Backblaze wants a payment method for public buckets): set B2_MEDIA_BUCKET_0001 only if you made one.
b2:
  raw_bucket_pattern: "ai-primer-raw-{n}"
  # Top prefix inside the private bucket. Folders are "<raw_prefix>/<domain id>/<primer id>/<stage id>/" (ids never change,
  # so renaming a stage costs nothing); the readable path lives in the Resources log.
  raw_prefix: "raw"
  inbox_prefix: "_Inbox"
  # Free Backblaze accounts refuse uploads past 10 GB; the pipeline then marks the account full and rolls over.
  free_tier_bytes: 10000000000
  large_file_threshold_mb: 100

# v2 control panel and pages: Notion. Mode is on when AIPRIMER_NOTION_PAGE_ID is set.
notion:
  version: "2022-06-28"
  # How many top-level blocks of an author page are scanned for inline comments (rate limit: 3 calls/s).
  comment_scan_blocks: 300
